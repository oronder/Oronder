name: Tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (system adapters, no Foundry required)
        run: npm test

      - name: Build
        run: npm run build

      - name: Prettier
        run: npx prettier --check src test
